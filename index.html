        darkMode: 'class',

          extend: {

              graphite: {
                900: '#2B2E34', // Background principal
                800: '#3B3F46', // Background secundário

              'fade-in': 'fadeIn 0.5s ease-out',
              'fade-in-down': 'fadeInDown 0.3s ease-out',

            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },

          },
        },
