
<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Jhan Analytics" />
    <link rel="apple-touch-icon" href="/pwa-512x512.png" />
    <link rel="icon" href="/pwa-512x512.png" />
    <meta name="description" content="Professional tactical analysis editor and esports management for Free Fire. Analyze matches, extract scoreboard stats with AI Vision, manage rosters and tournament statistics." />
    <title>Jhan Medeiros - Data Analyst</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              graphite: {
                900: '#000000', // Background principal
                800: '#0F0F0F', // Background secundário
                700: '#1A1A1A',
                600: '#2A2A2A', // Cinza médio
              },
              loud: {
                500: '#3AFF00', // Cor de destaque (accent)
                600: '#2CDB00', // Hover
              },
              premium: {
                card: '#D9D9DB',
                text: '#FFFFFF',
                muted: '#C7C7C7',
              },
              teamA: '#3b82f6', // Blue
              teamB: '#f97316', // Orange
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
              'fade-in-down': 'fadeInDown 0.3s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeInDown: {
                '0%': { opacity: '0', transform: 'translateY(-10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            },
          },
        },
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2canvas for taking screenshots of compositions/picks -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- jspdf for generating PDF presentations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- JSZip for ZIP exports -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
      // Suppress harmless Vite HMR WebSocket connection errors in iframe sandbox environments
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('websocket'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && typeof e.reason.message === 'string' && (e.reason.message.includes('WebSocket') || e.reason.message.includes('websocket'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
    <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100 transition-colors duration-300 antialiased selection:bg-brand-500 selection:text-gray-900">
    <div id="root">
        <div class="fixed inset-0 flex items-center justify-center text-brand-500 font-bold animate-pulse text-xl bg-gray-950 z-50">
            Carregando Jhan Medeiros Analytics...
        </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
