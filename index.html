
<!DOCTYPE html>

    <script>
      // Immediately safeguard against harmless Vite HMR WebSocket connection errors in sandbox
      (function() {
        if (typeof window === 'undefined') return;

        // 1. Intercept console.error to filter out HMR/WebSocket errors
        var origConsoleError = console.error;
        console.error = function() {
          var msg = '';
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            msg += ' ' + ((a && (a.stack || a.message)) || String(a));
          }
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        // 2. Global event listeners with capture: true
        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && e.error.message))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e && e.reason && (e.reason.message || e.reason.stack || String(e.reason))) || '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite]') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        // 3. Mock Vite HMR WebSocket so @vite/client never emits WebSocket close error
        if (typeof window.WebSocket !== 'undefined') {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var isHmr = (protocols === 'vite-hmr') ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              urlStr.indexOf('vite-hmr') !== -1 ||
              (urlStr.indexOf('/@vite') !== -1);

            if (isHmr) {
              var listeners = {};
              var dummyWs = {
                url: urlStr,
                readyState: 1, // OPEN
                protocol: 'vite-hmr',
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                send: function() {},
                close: function(code, reason) {
                  dummyWs.readyState = 3; // CLOSED
                  var event = { wasClean: true, code: code || 1000, reason: reason || 'HMR disabled' };
                  if (typeof dummyWs.onclose === 'function') dummyWs.onclose(event);
                  if (listeners['close']) {
                    listeners['close'].forEach(function(fn) { fn(event); });
                  }
                },
                addEventListener: function(type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      var event = { type: 'open' };
                      if (typeof dummyWs.onopen === 'function') dummyWs.onopen(event);
                      fn(event);
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
                  }
                },
                dispatchEvent: function() { return true; }
              };
              return dummyWs;
            }
            return new NativeWebSocket(url, protocols);
          };

          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }
      })();
    </script>
